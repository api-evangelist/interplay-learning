aid: interplay-learning
name: Interplay Learning
description: 'Interplay Learning is an Austin, Texas edtech company delivering always-on,
  immersive skilled trades training through online video courses, 3D simulations, and
  VR for HVAC, plumbing, electrical, facilities maintenance, and solar. Its SkillMill
  platform has trained more than 500,000 workers to be job-ready, pairing hands-on
  simulations with custom learning paths, certification prep, and skill assessments.
  For employers, Interplay exposes an enterprise data-integration API plus SSO and LMS
  integrations so training data can flow into an organization''s own systems; it publishes
  no public self-serve developer portal or OpenAPI. Backed by Sierra Ventures. This
  profile was enriched from the company''s public web surface.'
